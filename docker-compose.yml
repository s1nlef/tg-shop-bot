services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "tg_shop"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  migrate:
    build:
      context: .
      network: host
    env_file: .env
    network_mode: host
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"  
  
  bot:
    build:
      context: .
      network: host
    env_file: .env
    network_mode: host
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
